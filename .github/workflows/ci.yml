name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client
        run: npm --prefix client install
      - name: Lint client
        run: npm --prefix client run lint
      - name: Build client
        run: npm --prefix client run build
      - name: Install server
        run: npm --prefix server install
      - name: Check server syntax
        run: node --check server/src/server.js && node --check server/src/sync.js && node --check server/src/jobSources.js
