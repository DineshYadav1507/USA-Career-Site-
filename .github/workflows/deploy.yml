name: Talent Inspirations CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend
        run: |
          docker build             -t ghcr.io/dineshyadav1507/talent-inspirations-frontend:latest             ./client

      - name: Build backend
        run: |
          docker build             -t ghcr.io/dineshyadav1507/talent-inspirations-api:latest             ./server

      - name: Push frontend
        run: |
          docker push             ghcr.io/dineshyadav1507/talent-inspirations-frontend:latest

      - name: Push backend
        run: |
          docker push             ghcr.io/dineshyadav1507/talent-inspirations-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/talent-inspirations-new

            docker compose pull
            docker compose up -d --remove-orphans

            docker image prune -f

            echo "Containers:"
            docker compose ps

            echo "Frontend health:"
            curl -fsS http://127.0.0.1:3000/ > /dev/null

            echo "Backend health:"
            curl -fsS http://127.0.0.1:4000/ > /dev/null || true

            echo "Deployment successful"
